name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homestead
          POSTGRES_PASSWORD: homestead
          POSTGRES_DB: homestead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homestead" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://homestead:homestead@localhost:5432/homestead_test
      PGSSLMODE: disable
      AUTH_MODE: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  sandbox-acceptance:
    # Nightly A1–A9 against the BC sandbox and Plaid Sandbox. Needs the sandbox secrets as repository secrets
    # (never in code) and runs only when they exist; the result is posted to the Console's health page.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Acceptance tests (skipped until sandbox secrets are configured)
        env:
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_CERT_PEM: ${{ secrets.BC_CLIENT_CERT_PEM }}
          BC_ENVIRONMENT: CADE_Sandbox_vs25
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SANDBOX_SECRET: ${{ secrets.PLAID_SANDBOX_SECRET }}
        run: |
          if [ -z "$BC_CLIENT_ID" ]; then echo "No sandbox secrets configured; skipping A1–A9"; exit 0; fi
          pnpm --filter @homestead/acceptance test
