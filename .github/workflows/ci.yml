name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Sandbox run: minutes to wait at each step Cade does in BC (0 = report the step and move on)"
        required: false
        default: "0"
      autopost_check:
        description: "Sandbox run: run AP, which posts HHAPP/AUTOPOST through the API (needs HH App Connector 1.0.0.4). Use with wait_minutes."
        required: false
        type: boolean
        default: false
      a6_receiver:
        description: "Sandbox run: open a temporary public webhook receiver for A6 (Cloudflare quick tunnel, this run only). Use with wait_minutes."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homestead
          POSTGRES_PASSWORD: homestead
          POSTGRES_DB: homestead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homestead" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://homestead:homestead@localhost:5432/homestead_test
      PGSSLMODE: disable
      AUTH_MODE: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  console-smoke:
    # Playwright smoke test of every Console page in mock mode.
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @homestead/console exec playwright install --with-deps chromium
      - run: pnpm --filter @homestead/console exec playwright test
  sandbox-acceptance:
    # A1–A9 against the BC sandbox. The sandbox values are repository secrets (never in code); without them the job
    # says so and stops, because build-test already ran the same suite against MockBcServer. The harness refuses any
    # environment name without "sandbox" in it.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homestead
          POSTGRES_PASSWORD: homestead
          POSTGRES_DB: homestead_acceptance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homestead" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://homestead:homestead@localhost:5432/homestead_acceptance
      PGSSLMODE: disable
      AUTH_MODE: dev
      BC_SANDBOX_TENANT_ID: ${{ secrets.BC_SANDBOX_TENANT_ID }}
      BC_SANDBOX_ENVIRONMENT: CADE_Sandbox_vs25
      # The company id is found from its name at the start of the run (and printed); no GUID to look up by hand.
      BC_SANDBOX_COMPANY_NAME: ${{ vars.BC_SANDBOX_COMPANY_NAME || 'Cade & Vanessa Jones Family' }}
      BC_SANDBOX_CLIENT_ID: ${{ secrets.BC_SANDBOX_CLIENT_ID }}
      BC_SANDBOX_CERT_PEM: ${{ secrets.BC_SANDBOX_CERT_PEM }}
      BC_SANDBOX_CONNECTOR_INSTALLED: ${{ vars.BC_SANDBOX_CONNECTOR_INSTALLED || 'true' }}
      # A guided run (workflow_dispatch with wait_minutes): each of Cade's BC steps is waited for instead of reported.
      BC_SANDBOX_WAIT_MINUTES: ${{ github.event.inputs.wait_minutes || '0' }}
      BC_SANDBOX_AUTOPOST: ${{ github.event.inputs.autopost_check || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A6 only, on a guided run that asks for it (approved by Cade 10/21/2026). A Cloudflare quick tunnel (no account)
      # gives this run a random public https address that ends with the run. It forwards to the test run's receiver
      # (test/harness/world.ts startReceiver), which answers BC's webhook route only and 404s everything else. The
      # binary is a pinned release checked against Cloudflare's published SHA-256.
      - name: "A6: temporary public webhook receiver (this run only)"
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.a6_receiver == 'true' && env.BC_SANDBOX_CLIENT_ID != ''
        run: |
          set -euo pipefail
          v=2026.7.3
          sum=9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/$v/cloudflared-linux-amd64"
          echo "$sum  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cloudflared"
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8787 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          url=""
          for i in $(seq 1 60); do
            url=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1 || true)
            [ -n "$url" ] && break
            sleep 2
          done
          if [ -z "$url" ]; then echo "::error title=A6 receiver::The tunnel did not start"; tail -20 "$RUNNER_TEMP/tunnel.log"; exit 1; fi
          # Wait until Cloudflare routes the new hostname (502 is expected until the receiver starts in the test run).
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/v1/webhooks/bc" || true)
            case "$code" in 000|530) sleep 2 ;; *) break ;; esac
          done
          echo "WEBHOOK_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "HH_RECEIVER_PORT=8787" >> "$GITHUB_ENV"
          echo "::notice title=A6 receiver::Open for this run only, answering BC's webhook route only"
      - name: Acceptance tests A1–A9 against the BC sandbox
        run: |
          if [ -z "$BC_SANDBOX_CLIENT_ID" ]; then echo "No sandbox secrets configured yet; A1–A9 ran against MockBcServer in build-test"; exit 0; fi
          pnpm --filter @homestead/acceptance test
      # One annotation with every test's outcome: annotations are readable wherever the run is reviewed, logs are not.
      - name: Acceptance summary
        if: always()
        run: |
          f="$PWD/test/test-results/health.json"
          [ -f "$f" ] || exit 0
          node -e '
            const r = require(process.argv[1]);
            const esc = (s) => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            const rows = r.acceptance.map((a) => `${a.id} ${a.status}${a.note ? ": " + a.note : ""}`);
            console.log(`::notice title=Acceptance (${r.environment}, ${r.generatedAt})::${esc(rows.join("\n"))}`);
          ' "$f"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-health
          path: test/test-results/health.json
          if-no-files-found: ignore
