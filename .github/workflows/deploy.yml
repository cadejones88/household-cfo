# The deploy itself, shared by "Deploy dev" (every push to main) and "Deploy pilot" (a pilot-* tag), so the two
# environments are built by exactly the same steps. Signs in to Azure with OIDC federation (no cloud secret in
# GitHub; the federated credential's subject names the GitHub environment). Ids are configuration in repository
# variables; the only secret-shaped value is the Static Web App deployment token, fetched at deploy time and masked.
# Per environment: infra/main.<environment>.bicepparam, resource group rg-homestead-<environment>.

name: Deploy (shared)
on:
  workflow_call:
    inputs:
      environment:
        description: dev or pilot
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  HOMESTEAD_ENV: ${{ inputs.environment }}
  AZURE_LOCATION: westus3
  RESOURCE_GROUP: rg-homestead-${{ inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure sign-in (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pass 1: everything except the container app and jobs (apiImage empty). Creates the registry on the
      # first run and keeps the running app untouched on later runs.
      - name: Infrastructure (pass 1)
        id: infra1
        env:
          HOMESTEAD_ADMIN_OBJECT_ID: ${{ vars.HOMESTEAD_ADMIN_OBJECT_ID }}
          HOMESTEAD_ADMIN_UPN: ${{ vars.HOMESTEAD_ADMIN_UPN }}
          HOMESTEAD_BC_TENANT_ID: ${{ vars.HOMESTEAD_BC_TENANT_ID }}
          HOMESTEAD_BC_COMPANY_ID: ${{ vars.HOMESTEAD_BC_COMPANY_ID }}
          HOMESTEAD_BC_CLIENT_ID: ${{ vars.HOMESTEAD_BC_CLIENT_ID }}
          HOMESTEAD_PLAID_CLIENT_ID: ${{ vars.HOMESTEAD_PLAID_CLIENT_ID }}
          HOMESTEAD_ENTRA_TENANT_ID: ${{ vars.HOMESTEAD_ENTRA_TENANT_ID }}
          HOMESTEAD_ENTRA_API_AUDIENCE: ${{ vars.HOMESTEAD_ENTRA_API_AUDIENCE }}
          HOMESTEAD_FOUNDRY_ENDPOINT: ${{ vars.HOMESTEAD_FOUNDRY_ENDPOINT }}
          HOMESTEAD_FOUNDRY_MODEL: ${{ vars.HOMESTEAD_FOUNDRY_MODEL }}
          HOMESTEAD_BUDGET_EMAIL: ${{ vars.HOMESTEAD_BUDGET_EMAIL }}
          HOMESTEAD_API_IMAGE: ""
        run: |
          set -euo pipefail
          # Postgres refuses a configuration write while it is busy (a firewall change, a backup); that is
          # transient, so retry up to three times on ServerIsBusy and fail at once on anything else.
          for attempt in 1 2 3 4; do
            if az deployment sub create \
              --name "homestead-$HOMESTEAD_ENV-$(date -u +%Y%m%d%H%M%S)-1" \
              --location "$AZURE_LOCATION" \
              --template-file infra/main.bicep \
              --parameters "infra/main.$HOMESTEAD_ENV.bicepparam" \
              --query properties.outputs -o json > outputs1.json 2> deploy1.err; then
              break
            fi
            cat deploy1.err >&2
            if [ "$attempt" -lt 4 ] && grep -q ServerIsBusy deploy1.err; then
              echo "::warning::Postgres was busy (attempt $attempt); retrying in 90 seconds"
              sleep 90
            else
              exit 1
            fi
          done
          echo "registry=$(jq -r .registryLoginServer.value outputs1.json)" >> "$GITHUB_OUTPUT"
          echo "registryName=$(jq -r .registryName.value outputs1.json)" >> "$GITHUB_OUTPUT"
          echo "swa=$(jq -r .staticWebAppName.value outputs1.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push the API image
        id: image
        env:
          REGISTRY: ${{ steps.infra1.outputs.registry }}
          REGISTRY_NAME: ${{ steps.infra1.outputs.registryName }}
        run: |
          set -euo pipefail
          az acr login --name "$REGISTRY_NAME"
          IMAGE="$REGISTRY/homestead-api:${GITHUB_SHA::12}"
          docker build -f services/api/Dockerfile -t "$IMAGE" -t "$REGISTRY/homestead-api:$HOMESTEAD_ENV" .
          docker push "$IMAGE"
          docker push "$REGISTRY/homestead-api:$HOMESTEAD_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Pass 2: the container app and the jobs with the image just pushed.
      - name: Infrastructure (pass 2, container app and jobs)
        id: infra2
        env:
          HOMESTEAD_ADMIN_OBJECT_ID: ${{ vars.HOMESTEAD_ADMIN_OBJECT_ID }}
          HOMESTEAD_ADMIN_UPN: ${{ vars.HOMESTEAD_ADMIN_UPN }}
          HOMESTEAD_BC_TENANT_ID: ${{ vars.HOMESTEAD_BC_TENANT_ID }}
          HOMESTEAD_BC_COMPANY_ID: ${{ vars.HOMESTEAD_BC_COMPANY_ID }}
          HOMESTEAD_BC_CLIENT_ID: ${{ vars.HOMESTEAD_BC_CLIENT_ID }}
          HOMESTEAD_PLAID_CLIENT_ID: ${{ vars.HOMESTEAD_PLAID_CLIENT_ID }}
          HOMESTEAD_ENTRA_TENANT_ID: ${{ vars.HOMESTEAD_ENTRA_TENANT_ID }}
          HOMESTEAD_ENTRA_API_AUDIENCE: ${{ vars.HOMESTEAD_ENTRA_API_AUDIENCE }}
          HOMESTEAD_FOUNDRY_ENDPOINT: ${{ vars.HOMESTEAD_FOUNDRY_ENDPOINT }}
          HOMESTEAD_FOUNDRY_MODEL: ${{ vars.HOMESTEAD_FOUNDRY_MODEL }}
          HOMESTEAD_BUDGET_EMAIL: ${{ vars.HOMESTEAD_BUDGET_EMAIL }}
          HOMESTEAD_API_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          # Postgres refuses a configuration write while it is busy (a firewall change, a backup); that is
          # transient, so retry up to three times on ServerIsBusy and fail at once on anything else.
          for attempt in 1 2 3 4; do
            if az deployment sub create \
              --name "homestead-$HOMESTEAD_ENV-$(date -u +%Y%m%d%H%M%S)-2" \
              --location "$AZURE_LOCATION" \
              --template-file infra/main.bicep \
              --parameters "infra/main.$HOMESTEAD_ENV.bicepparam" \
              --query properties.outputs -o json > outputs2.json 2> deploy2.err; then
              break
            fi
            cat deploy2.err >&2
            if [ "$attempt" -lt 4 ] && grep -q ServerIsBusy deploy2.err; then
              echo "::warning::Postgres was busy (attempt $attempt); retrying in 90 seconds"
              sleep 90
            else
              exit 1
            fi
          done
          echo "apiUrl=$(jq -r .apiUrl.value outputs2.json)" >> "$GITHUB_OUTPUT"
          echo "consoleUrl=$(jq -r .consoleUrl.value outputs2.json)" >> "$GITHUB_OUTPUT"

      - name: Database migrations (reminder)
        # Migrations run as a Postgres Entra administrator (Cade) from his machine until a migration job with its
        # own identity is added; the deployer identity deliberately has no database rights.
        run: echo "If db/migrations changed, run 'pnpm --filter @homestead/api db:migrate' as an administrator (docs/runbook-azure-setup.md, step 9)."

      - name: API smoke
        env:
          API_URL: ${{ steps.infra2.outputs.apiUrl }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "$API_URL/health" >/dev/null; then echo "API healthy at $API_URL"; exit 0; fi
            sleep 10
          done
          echo "API did not answer /health within 200 s" >&2; exit 1

      # ---- Console → Static Web Apps -------------------------------------------------------------------------
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build the Console
        env:
          VITE_API_MODE: http
          VITE_AUTH_MODE: entra
          VITE_API_BASE_URL: ${{ steps.infra2.outputs.apiUrl }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.HOMESTEAD_CONSOLE_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ vars.HOMESTEAD_ENTRA_AUTHORITY }}
          VITE_ENTRA_KNOWN_AUTHORITY: ${{ vars.HOMESTEAD_ENTRA_KNOWN_AUTHORITY }}
          VITE_ENTRA_API_SCOPE: ${{ vars.HOMESTEAD_ENTRA_API_SCOPE }}
          VITE_BC_TENANT: ${{ vars.HOMESTEAD_BC_TENANT_ID }}
          VITE_BC_ENVIRONMENT: CADE_Sandbox_vs25
          VITE_BC_COMPANY: ${{ vars.HOMESTEAD_BC_COMPANY_NAME }}
        run: pnpm --filter @homestead/shared build && pnpm --filter @homestead/console build

      - name: Static Web App deployment token (fetched, never stored)
        id: swa
        env:
          SWA_NAME: ${{ steps.infra1.outputs.swa }}
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy the Console
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          skip_app_build: true
          # staticwebapp.config.json (SPA fallback, security headers) ships inside dist from apps/console/public;
          # this action version has no config_file_location input and silently ignored it on the first deploy.
          app_location: apps/console/dist

      - name: Prune old images (keep the last 10 tags)
        env:
          REGISTRY_NAME: ${{ steps.infra1.outputs.registryName }}
        run: |
          set -euo pipefail
          az acr repository show-tags --name "$REGISTRY_NAME" --repository homestead-api --orderby time_desc -o tsv \
            | grep -v "^$HOMESTEAD_ENV\$" | tail -n +11 \
            | xargs -r -I{} az acr repository delete --name "$REGISTRY_NAME" --image "homestead-api:{}" --yes

      - name: Summary
        run: |
          {
            echo "## Homestead $HOMESTEAD_ENV"
            echo "- API: ${{ steps.infra2.outputs.apiUrl }}"
            echo "- Console: ${{ steps.infra2.outputs.consoleUrl }}"
            echo "- Image: ${{ steps.image.outputs.image }}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Also as an annotation, which the REST API returns (the step summary it does not). URLs are not secrets.
          echo "::notice title=Homestead ${{ inputs.environment }}::API ${{ steps.infra2.outputs.apiUrl }} | Console ${{ steps.infra2.outputs.consoleUrl }}"
