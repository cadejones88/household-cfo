name: HH App Connector (compile)
# Compiles the AL extension in bc/hh-app-connector against Microsoft's public symbol packages (no BC environment, no
# container, no credentials) and publishes the .app as a release asset Cade uploads in BC's Extension Management.
# Compiler errors come back as annotations on the run.
on:
  push:
    branches: [main]
    paths: ["bc/hh-app-connector/**", "scripts/al/**", ".github/workflows/al-compile.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      PROJECT: bc/hh-app-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install the AL compiler (.NET tool)
        run: |
          dotnet tool install --global Microsoft.Dynamics.BusinessCentral.Development.Tools \
            || dotnet tool install --global Microsoft.Dynamics.BusinessCentral.Development.Tools --prerelease
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          ls "$HOME/.dotnet/tools"
      - name: Fetch symbols from Microsoft's public feed
        run: python3 scripts/al/fetch-symbols.py "$PROJECT"
      - name: Compile
        id: compile
        run: |
          set -o pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('$PROJECT/app.json',encoding='utf-8-sig'))['version'])")
          OUT="$RUNNER_TEMP/Cade T. Jones CPA, P.C._HH App Connector_${VERSION}.app"
          AL=$(command -v al || command -v altool || command -v alc)
          echo "::notice::compiler: $AL"
          "$AL" compile /project:"$PROJECT" /packagecachepath:"$PROJECT/.alpackages" /out:"$OUT" 2>&1 | tee "$RUNNER_TEMP/al.log" || true
          # Turn compiler diagnostics into annotations: path(line,col): error AL0000: message
          python3 - "$RUNNER_TEMP/al.log" <<'PY'
          import re, sys
          pat = re.compile(r"^(?P<path>.+?)\((?P<line>\d+),(?P<col>\d+)\): (?P<sev>error|warning) (?P<code>AL\d+): (?P<msg>.*)$")
          errors = 0
          for raw in open(sys.argv[1], encoding="utf-8", errors="replace"):
              m = pat.match(raw.strip())
              if not m:
                  continue
              path = m["path"].split("bc/hh-app-connector/")[-1]
              kind = "error" if m["sev"] == "error" else "warning"
              errors += kind == "error"
              print(f"::{kind} file=bc/hh-app-connector/{path},line={m['line']},col={m['col']}::{m['code']} {m['msg']}")
          print(f"::notice::{errors} compile error(s)")
          PY
          if [ ! -f "$OUT" ]; then echo "::error::No .app produced; see the annotations above"; tail -40 "$RUNNER_TEMP/al.log" | sed 's/^/::notice::/' ; exit 1; fi
          echo "app=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hh-app-connector
          path: ${{ steps.compile.outputs.app }}
      - name: Publish as a release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hh-app-connector-v${{ steps.compile.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "HH App Connector ${{ steps.compile.outputs.version }}" \
            --notes "Compiled from bc/hh-app-connector at ${GITHUB_SHA::7} against BC 27 symbols. Upload in Business Central (sandbox CADE_Sandbox_vs25): Extension Management > Manage > Upload Extension."
          cp "${{ steps.compile.outputs.app }}" "$RUNNER_TEMP/HH-App-Connector.app"
          gh release upload "$TAG" "$RUNNER_TEMP/HH-App-Connector.app" --clobber
