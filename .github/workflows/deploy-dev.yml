# Deploys dev on every push to main, once the repository variable DEPLOY_ENABLED is "true" (spec: Repository
# layout, "main is deployable to dev on every merge"). dev holds synthetic data only: BC sandbox, Plaid Sandbox.
# The steps live in deploy.yml, shared with the pilot. One-time setup: docs/runbook-azure-setup.md, steps 1-2 and 8.

name: Deploy dev
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
